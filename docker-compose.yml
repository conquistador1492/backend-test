version: '3.8'

services:
  db:
    image: postgres:15
    restart: always

    environment:
      POSTGRES_DB: ${POSTGRES_DB_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGPORT: ${POSTGRES_PORT}

  python:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    depends_on:
      - db
    env_file:
      - .env.example

    environment:
      POSTGRES_HOST: "db"

    ports:
      - "8000:8000"
